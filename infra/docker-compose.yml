version: '3.8'

services:
  nginx:
    image: nginx:alpine
    labels:
      - "project=api"
    container_name: nginx-proxy
    security_opt:
      - apparmor:unconfined
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/log/nginx-stack:/var/log/nginx
    networks:
      - lab-network
    restart: always

  suricata:
    image: jasonish/suricata:8.0.4
    labels:
      - "project=api"
    container_name: suricata
    security_opt:
      - apparmor:unconfined
    network_mode: "host"
    privileged: true
    environment:
      - SURICATA_OPTIONS=-i enp0s3 -S /var/lib/suricata/rules/suricata.rules
    volumes:
      - /var/log/suricata:/var/log/suricata
      - /var/log/suricata/rules:/var/lib/suricata/rules
    restart: always

networks:
  lab-network:
    external: true