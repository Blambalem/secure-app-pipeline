version: '3.8'

services:
  mailserver:
    image: mailserver/docker-mailserver:15.1.0
    container_name: mailserver
    hostname: mail
    domainname: localdomain
    user: "1000:1000"
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
    volumes:
      - /var/log/mail-stack:/var/log/mail:rw
      - ./mail-data:/var/mail
      - ./mail-state:/var/mail-state
      - ./mail-config:/tmp/docker-mailserver
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ONE_DIR=1
    networks:
      - lab-network
    restart: always

  web-app:
    image: secure-app:latest
    container_name: my-secure-container
    user: "1000:1000"
    init: true
    security_opt:
      - apparmor:unconfined
    build:
      context: ../app
      dockerfile: Dockerfile
    expose:
      - "8000"
    networks:
      - lab-network
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    user: "1000:1000"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/log/nginx-stack:/var/log/nginx
    networks:
      - lab-network
    restart: always

networks:
  lab-network:
    driver: bridge