name: Deploy Application to Linux Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Job 1: Детекция изменений
  detect-changes:
    runs-on: self-hosted
    outputs:
      infra_changed: ${{ steps.check_changes.outputs.infra_changed }}
      apps_changed: ${{ steps.check_changes.outputs.apps_changed }}
    steps:
      - name: Fix workspace permissions before checkout
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace alpine chown -R 1000:1000 /workspace || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect Changes
        id: check_changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^infra/'; then
            echo "infra_changed=true" >> $GITHUB_OUTPUT
            echo "--- INFRASTRUCTURE CHANGED ---"
          fi
          if git diff --name-only HEAD~1 HEAD | grep -q '^apps/'; then
            echo "apps_changed=true" >> $GITHUB_OUTPUT
            echo "--- APPLICATIONS CHANGED ---"
          fi

  # Job 2: Сборка App1, Сканирование Trivy и Сборка App2
  build-and-scan-apps:
    needs: [detect-changes, security-sast]
    if: needs.detect-changes.outputs.apps_changed == 'true'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # --- App 1 ---
      - name: Build Docker Image (App1)
        run: |
          docker build --no-cache -f ./apps/app1/backend/Dockerfile -t secure-app1:latest ./apps/app1

      - name: Scan Docker Image App1 with Trivy
        uses: Blambalem/shared-workflows/.github/workflows/reusable-security.yml@main
        with:
          run-trivy: true
          image-name: 'secure-app1:latest'
          runner: 'self-hosted'

      # --- App 2 ---
      - name: Build Docker Image (App2)
        run: |
          docker build --no-cache -f ./apps/app2/backend/Dockerfile -t secure-app2:latest ./apps/app2

      - name: Scan Docker Image App2 with Trivy
        uses: Blambalem/shared-workflows/.github/workflows/reusable-security.yml@main
        with:
          run-trivy: true
          image-name: 'secure-app2:latest'
          runner: 'self-hosted'

  # Job 3: Деплой приложений
  deploy-apps:
    needs: [detect-changes, build-and-scan-apps]
    if: needs.detect-changes.outputs.apps_changed == 'true'
    runs-on: self-hosted
    steps:
      - name: Ensure Docker Network Exists
        run: docker network create lab-network || true

      - name: Run Applications Stack via Docker Compose
        run: |
          cd ${{ github.workspace }}/apps
          docker-compose up -d --no-deps --build web-app image-app

  # Job 4: Деплой инфраструктуры
  deploy-infra:
    needs: detect-changes
    if: needs.detect-changes.outputs.infra_changed == 'true'
    runs-on: self-hosted
    steps:
      - name: Rebuild and Run Infrastructure via Docker Compose
        run: |
          cd ${{ github.workspace }}/infra
          docker-compose down || true 
          docker-compose up -d --build
          sleep 5
          docker exec mailserver setup email add user1@localdomain "password123" || true
          docker-compose ps